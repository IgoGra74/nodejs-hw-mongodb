tags:
  - Contacts
summary: Update contact
operationId: patchContactById
description: Patch a contact with payload
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '6655a67a37bc0571c96d9655'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Igor Grabic'
          phoneNumber:
            description: "Contact's phone number"
            type: number
            example: '0123456789'
          email:
            description: "Contact's email"
            type: string
            example: 'grabic@gmail.com'
          isFavourite:
            description: 'Whether the contact is a favourite'
            type: boolean
            example: false
          contactType:
            description: "Contact's type. Default value is 'personal'"
            type: string
            enum: ['personal', 'work', 'home']
            example: 'personal'
          photo:
            description: "Contact's photo"
            type: string
            format: binary
      encoding:
        photo:
          contentType: image/*
responses:
  '200':
    description: 'Successfully patched a contact!'
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '404':
    $ref: '../../../components/responses/404.yaml'
